<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лаборатория Сириус — физика 7 класса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBF7; --ink:#1F2340; --muted:#6B6F85; --surf:#FFFFFF; --grid:#E6E4EC; --line:#E4E2EA;
  --plum:#9B2D67; --teal:#50ADA8; --green:#367A55; --lime:#99CC42; --pink:#F8D3E8; --soft:#F3F1F7;
  --brand:#5B3C9E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
    --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F;
  }
}
:root[data-theme="dark"]{
  --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
  --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.view{animation:viewIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:16px 20px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;border-radius:10px}
.logo svg{width:38px;height:auto;flex:none}
.logo b{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.2px}
.logo span{font-size:22px;font-weight:500;color:var(--muted);margin-left:-4px}

/* home */
.hero{padding:18px 20px 6px}
.hero h1{margin:0;font-size:clamp(34px,9vw,52px);line-height:1.05;font-weight:800;letter-spacing:-1px}
.hero p{margin:12px 0 0;color:var(--muted);font-size:18px;max-width:36ch}
.progress{margin:20px 20px 4px;display:flex;align-items:center;gap:14px;font-weight:600;color:var(--muted);font-size:15px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--soft);font-weight:600;font-size:15px;color:var(--ink);
  transition:background-color .18s,color .18s,border-color .18s,transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{opacity:.55;font-weight:500;margin-left:6px}
.cards{display:grid;gap:16px;padding:6px 20px 40px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;border-radius:30px;padding:24px;min-height:300px;display:flex;flex-direction:column;
  background:var(--c);color:#fff;text-align:left;border:0;width:100%;text-decoration:none;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 18px 32px -20px var(--c)}
  .card:hover .go{transform:translateX(3px)}}
.card:active{transform:scale(.985)}
.card:focus-visible{outline-offset:4px}
.card .pb{height:8px;width:56%;border-radius:5px;background:rgba(255,255,255,.28);margin:0 0 22px 8px;overflow:hidden}
.card .pb i{display:block;height:100%;width:0;background:var(--lime);border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1) .2s}
.card.seen.ready .pb i{width:100%}
.tag{align-self:flex-start;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.card h2{margin:14px 0 8px;font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.4px}
.card p{margin:0;opacity:.88;font-size:16px}
.card .foot{margin-top:auto;padding-top:22px;display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.card .meta{font-size:15px;opacity:.8;display:flex;align-items:center;gap:8px}
.go{background:var(--lime);color:#1B2A0A;font-weight:700;font-size:18px;border-radius:16px;padding:14px 28px;border:0;flex:1;text-align:center;max-width:220px;transition:transform .2s}

/* lab */
.labhead{background:var(--lab);color:#fff;padding:14px 20px 78px}
.back{background:rgba(255,255,255,.18);border:0;border-radius:999px;color:#fff;font-weight:600;padding:8px 16px 8px 12px;display:inline-flex;gap:6px;align-items:center;font-size:15px;transition:background-color .15s}
.back:hover{background:rgba(255,255,255,.28)}
.labhead h1{margin:18px 0 6px;font-size:clamp(30px,8vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.7px}
.labhead p{margin:0;opacity:.9;max-width:40ch}
.labhead .tag{margin-top:16px;display:inline-block}
.sheet{margin-top:-58px;position:relative;padding:0 14px 60px}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-radius:26px;
  padding:8px;box-shadow:0 2px 0 var(--line), 0 12px 30px -18px rgba(31,35,64,.5)}
.stage canvas{display:block;width:100%;aspect-ratio:640/400;border-radius:20px;touch-action:pan-y}
.stage .paused{position:absolute;right:20px;top:18px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;
  border-radius:999px;padding:4px 12px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.stage.is-paused .paused{opacity:1;transform:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 6px 4px}
.btn{border-radius:16px;padding:12px 20px;font-weight:700;border:2px solid var(--line);background:var(--surf);
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background-color .15s,border-color .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn.main{background:var(--lime);border-color:var(--lime);color:#1B2A0A}
@media(hover:hover){.btn:not(.main):hover{border-color:var(--muted)}}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 6px}
.out{background:var(--soft);border-radius:18px;padding:12px 14px;min-width:0}
.out small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.out b.long{font-size:16px}
.out b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;display:block;overflow-wrap:anywhere;line-height:1.3;margin-top:2px}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:26px 6px 12px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 6px 10px}
.presets .chip{border:2px solid var(--line);background:var(--surf)}
.presets .chip[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:#fff}
.ctl{background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:10px 6px}
.ctl .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.val{background:var(--pink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;display:inline-block}
.val.pop{animation:pop .22s ease-out}
@keyframes pop{40%{transform:scale(1.08)}}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;margin:12px 0 2px;height:28px;accent-color:var(--lab);--fill:50%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(to right,var(--lab) var(--fill),var(--grid) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surf);
  border:4px solid var(--lab);margin-top:-9px;box-shadow:0 2px 6px rgba(31,35,64,.25);transition:transform .12s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--grid)}
input[type=range]::-moz-range-progress{height:8px;border-radius:5px;background:var(--lab)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surf);border:4px solid var(--lab)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--brand);outline-offset:2px}
.seg{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px;font-weight:600;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:#fff}
.note{border-radius:26px;padding:20px 22px;margin:14px 6px;background:var(--pink)}
.note b{font-weight:800}
.note.f{background:var(--soft)}
.note .fm{font-size:20px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.note .fm.t{font-size:17px;line-height:1.4}
.note ul,.note ol{margin:8px 0 0;padding-left:20px}
.note li{margin:6px 0}
.nextlab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 6px 0;padding:20px 22px;border-radius:26px;
  background:var(--c);color:#fff;text-decoration:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nextlab small{display:block;opacity:.8;font-size:14px;font-weight:600}
.nextlab b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.nextlab svg{flex:none;width:44px;height:44px;border-radius:14px;background:var(--lime);color:#1B2A0A;padding:12px;transition:transform .2s}
@media(hover:hover){.nextlab:hover svg{transform:translateX(3px)}}
.nextlab:active{transform:scale(.985)}
.cards{perspective:1200px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:30%;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 45%)}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-4px) rotateX(var(--rx)) rotateY(var(--ry))}.card:hover::after{opacity:1}}
.stage{perspective:1400px}
.stage canvas{--rx:0deg;--ry:0deg;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
  .card:hover,.stage canvas{transform:none!important}
  .view,.val.pop{animation:none}
  .bar i,.card,.card .pb i,.go,.nextlab,.nextlab svg{transition:none}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
const W=640,H=400;
const $=(s,r=document)=>r.querySelector(s);
const NF={};
const f1=(x,d=1)=>{x=Number(x);if(!isFinite(x))return '—';if(Math.abs(x)<0.5*Math.pow(10,-d))x=0;
  return (NF[d]||(NF[d]=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}))).format(x)};
const fJ=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кДж':f1(x,Math.abs(x)<10?2:0)+' Дж';
const fWt=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кВт':f1(x,0)+' Вт';
const fPa=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кПа':f1(x,0)+' Па';
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const ease=(c,t,dt,k)=>c+(t-c)*(1-Math.exp(-dt*k));
const rgb=h=>{h=String(h).trim();if(h.startsWith('rgb')){const m=h.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mixc=(a,b,t)=>{const x=rgb(a),y=rgb(b);return `rgb(${Math.round(x[0]+(y[0]-x[0])*t)},${Math.round(x[1]+(y[1]-x[1])*t)},${Math.round(x[2]+(y[2]-x[2])*t)})`};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const FONT="'Golos Text',system-ui,sans-serif";
const G=9.8;
let TS=1;

let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['ink','muted','surf','grid','plum','teal','green','lime','soft','pink','line'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());
  C.dark=rgb(C.surf).reduce((a,b)=>a+b,0)<300;
}
function arrow(g,x1,y1,x2,y2,col,w){
  w=w||3;const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;
  const a=Math.atan2(y2-y1,x2-x1),h=Math.min(9+w,L*.9);
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.6,y2-Math.sin(a)*h*.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-.42),y2-h*Math.sin(a-.42));g.lineTo(x2-h*Math.cos(a+.42),y2-h*Math.sin(a+.42));g.closePath();g.fill();
}
function txt(g,s,x,y,o){
  o=o||{};g.font=`${o.w||600} ${(o.s||14)*TS}px ${FONT}`;g.fillStyle=o.c||C.ink;g.textAlign=o.a||'left';g.textBaseline=o.b||'alphabetic';g.fillText(s,x,y);
}
function badge(g,s,x,y,col,a){
  g.font=`700 ${14*TS}px ${FONT}`;const w=g.measureText(s).width+28;
  const bx=a==='right'?x-w:a==='center'?x-w/2:x;
  g.fillStyle=col;g.beginPath();g.roundRect(bx,y,w,34,12);g.fill();
  txt(g,s,bx+w/2,y+22,{a:'center',c:'#fff',s:14,w:700});
}
/* динамометр: крючок в (x,y), корпус уходит в направлении ang */
function dyn(g,x,y,ang,F,Fmax,len){
  len=len||100;
  g.save();g.translate(x,y);g.rotate(ang);
  g.strokeStyle=C.ink;g.lineWidth=2.5;g.lineCap='round';
  g.beginPath();g.moveTo(0,0);g.lineTo(12,0);g.stroke();
  g.fillStyle=C.surf;g.beginPath();g.roundRect(12,-11,len,22,8);g.fill();g.stroke();
  g.strokeStyle=C.muted;g.lineWidth=1;
  for(let i=0;i<=10;i++){const xx=22+i*(len-30)/10;g.beginPath();g.moveTo(xx,-11);g.lineTo(xx,i%5?-6:-3);g.stroke()}
  const px=22+clamp(F/Fmax,0,1)*(len-30);
  g.strokeStyle=C.ink;g.lineWidth=1.6;g.beginPath();g.moveTo(px,0);
  const n=9;for(let i=1;i<=n;i++){g.lineTo(px+(len+4-px)*i/n,i%2?4:-4)}g.stroke();
  g.fillStyle=C.plum;g.fillRect(px-2,-8,4,16);
  g.strokeStyle=C.ink;g.lineWidth=2.5;g.beginPath();g.arc(len+22,0,9,0,7);g.stroke();
  g.restore();
}
/* ===== 3D-рендер: косоугольная проекция, свет сверху-слева ===== */
const DX=0.62,DY=-0.42; // направление «вглубь»
const lighten=(h,k)=>mixc(h,'#ffffff',k), darken=(h,k)=>mixc(h,'#000000',k);
const SPR=new Map();
function sprite(r,col){
  const q=Math.max(2,Math.round(r*2)/2),key=q+'|'+col;let c=SPR.get(key);
  if(!c){const s=3,R=q*s,pad=2;c=document.createElement('canvas');c.width=c.height=Math.ceil(2*R+pad*2);
    const x=c.getContext('2d'),m=R+pad,gr=x.createRadialGradient(m-R*.38,m-R*.42,R*.08,m,m,R);
    gr.addColorStop(0,lighten(col,.75));gr.addColorStop(.35,lighten(col,.15));gr.addColorStop(.85,col);gr.addColorStop(1,darken(col,.35));
    x.fillStyle=gr;x.beginPath();x.arc(m,m,R,0,7);x.fill();
    if(SPR.size>600)SPR.clear();SPR.set(key,c)}
  return c;
}
/* шар с объёмом */
function sph(g,x,y,r,col){if(r<=0)return;const c=sprite(r,col),d=c.width/3;g.drawImage(c,x-d/2,y-d/2,d,d)}
/* мягкая тень на полу */
function shadow(g,x,y,rx,a){a=a===undefined?.22:a;if(rx<=0)return;g.save();g.translate(x,y);g.scale(1,.28);
  const gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,`rgba(0,0,0,${C.dark?a*1.6:a})`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,7);g.fill();g.restore()}
/* брусок: передняя грань (x,y,w,h), глубина d */
function box3(g,x,y,w,h,col,d,o){
  o=o||{};d=d===undefined?Math.min(26,w*.35+6):d;const ox=d*DX,oy=d*DY;
  if(o.shadow!==false)shadow(g,x+w/2+ox/2,y+h+oy/2+1,w*.62+d*.3,.18);
  g.lineJoin='round';
  g.fillStyle=lighten(col,.28);g.beginPath();g.moveTo(x,y);g.lineTo(x+ox,y+oy);g.lineTo(x+w+ox,y+oy);g.lineTo(x+w,y);g.closePath();g.fill();
  g.fillStyle=darken(col,.22);g.beginPath();g.moveTo(x+w,y);g.lineTo(x+w+ox,y+oy);g.lineTo(x+w+ox,y+h+oy);g.lineTo(x+w,y+h);g.closePath();g.fill();
  const gr=g.createLinearGradient(x,y,x,y+h);gr.addColorStop(0,lighten(col,.08));gr.addColorStop(1,darken(col,.08));
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  if(o.stroke){g.strokeStyle=o.stroke;g.lineWidth=o.lw||2;g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y);g.lineTo(x+ox,y+oy);g.lineTo(x+w+ox,y+oy);g.lineTo(x+w+ox,y+h+oy);g.lineTo(x+w,y+h);g.closePath();g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w+ox,y+oy);g.moveTo(x+w,y);g.lineTo(x+w,y+h);g.stroke()}
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x,y,w,1.5);
}
/* вертикальный цилиндр: центр cx, верх y1, низ y2, радиус rx */
function cyl(g,cx,y1,y2,rx,col,o){
  o=o||{};const ry=o.ry||rx*.3;if(y2<y1)return;
  if(o.shadow)shadow(g,cx,y2+2,rx*1.25,.2);
  const gr=g.createLinearGradient(cx-rx,0,cx+rx,0);
  gr.addColorStop(0,darken(col,.18));gr.addColorStop(.3,lighten(col,.35));gr.addColorStop(.55,col);gr.addColorStop(1,darken(col,.38));
  g.fillStyle=gr;g.beginPath();g.moveTo(cx-rx,y1);g.lineTo(cx-rx,y2);g.ellipse(cx,y2,rx,ry,0,Math.PI,0,true);g.lineTo(cx+rx,y1);g.closePath();g.fill();
  if(o.top!==false){g.fillStyle=o.topc||lighten(col,.3);g.beginPath();g.ellipse(cx,y1,rx,ry,0,0,7);g.fill();
    g.strokeStyle=darken(col,.15);g.lineWidth=1;g.stroke()}

  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act==='home'){if(cur)goHome();else window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.act==='back'){goHome();return}
  if(t.dataset.cat){setFilter(t.dataset.cat);return}
  if(!cur)return;
  if(t.dataset.act==='pause'){setPaused(!paused);return}
  if(t.dataset.act==='restart'){cur.init(S,P);setPaused(false);updateOuts();return}
  if(t.dataset.act==='reset'){cur.params.forEach(p=>P[p.id]=p.val);cur.init(S,P);syncControls();clearPresets();updateOuts();return}
  if(t.dataset.preset!==undefined){Object.assign(P,cur.presets[+t.dataset.preset][1]);cur.init(S,P);syncControls();clearPresets();t.setAttribute('aria-pressed','true');setPaused(false);updateOuts();return}
  const seg=t.closest('[data-seg]');
  if(seg){if(P[seg.dataset.seg]===t.dataset.v)return;P[seg.dataset.seg]=t.dataset.v;syncControls();clearPresets();changed(seg.dataset.seg);updateOuts()}
});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.p||!cur)return;
  const p=cur.params.find(x=>x.id===el.dataset.p);P[p.id]=parseFloat(el.value);setFill(el);
  const v=$('#v_'+p.id);v.textContent=fmtVal(p,P[p.id]);bump(v);clearPresets();changed(p.id);updateOuts();
});
document.addEventListener('keydown',e=>{
  if(!cur||e.altKey||e.ctrlKey||e.metaKey)return;const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){goHome();return}
  if(e.key===' '&&tag!=='input'&&tag!=='button'&&tag!=='a'){e.preventDefault();setPaused(!paused)}
});
function route(){
  const m=location.hash.match(/^#lab\/([\w-]+)$/);
  if(m&&LABS.some(l=>l.id===m[1]))openLab(m[1]);else{fromHome=false;home()}
}
const tiltOK=()=>window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
app.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||!tiltOK())return;
  const c=e.target.closest('.card');
  if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');
    c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');return}
  const st=e.target.closest('.stage');
  if(st&&cv){const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    cv.style.setProperty('--ry',((x-.5)*4).toFixed(2)+'deg');cv.style.setProperty('--rx',((.5-y)*3).toFixed(2)+'deg')}
});
app.addEventListener('pointerout',e=>{
  const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}
  const st=e.target.closest('.stage');if(st&&cv&&!st.contains(e.relatedTarget)){cv.style.setProperty('--rx','0deg');cv.style.setProperty('--ry','0deg')}
});
window.addEventListener('hashchange',route);
window.addEventListener('resize',sizeCanvas);
if(window.ResizeObserver)new ResizeObserver(()=>sizeCanvas()).observe(app);
const themeUpdate=()=>{readColors();if(cur&&g&&paused)frame()};
if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?mq.addEventListener('change',themeUpdate):mq.addListener&&mq.addListener(themeUpdate)}
new MutationObserver(themeUpdate).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
document.addEventListener('visibilitychange',()=>{last=performance.now()});

readColors();route();
})();
</script>
</body>
