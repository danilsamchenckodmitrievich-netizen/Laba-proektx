<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лаборатория Сириус — физика 7 класса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBF7; --ink:#1F2340; --muted:#6B6F85; --surf:#FFFFFF; --grid:#E6E4EC; --line:#E4E2EA;
  --plum:#9B2D67; --teal:#50ADA8; --green:#367A55; --lime:#99CC42; --pink:#F8D3E8; --soft:#F3F1F7;
  --brand:#5B3C9E; --okbg:#E4F2CB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
    --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F; --okbg:#33401F;
  }
}
:root[data-theme="dark"]{
  --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
  --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F; --okbg:#33401F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.view{animation:viewIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;gap:6px;padding:16px 20px}
.chev,.burger{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:inline-flex}
.chev svg{width:22px;height:22px}.burger svg{width:30px;height:30px}
@media(hover:hover){.chev:hover,.burger:hover{background:var(--soft)}}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;border-radius:10px}
.logo svg{width:38px;height:auto;flex:none}
.logo b{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.2px}
.logo span{font-size:22px;font-weight:500;color:var(--muted);margin-left:-4px}
.logo div{white-space:nowrap}
@media(max-width:400px){.logo{gap:8px}.logo svg{width:30px}.logo b,.logo span{font-size:17px}.top{padding:14px 10px 14px 16px;gap:2px}.chev svg{width:20px;height:20px}.theme svg{width:22px;height:22px}.burger svg{width:26px;height:26px}}

/* home */
.hero{padding:34px 20px 10px}
.hero h1{margin:0;font-size:clamp(32px,8vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.6px}
.hero p{margin:12px 0 0;color:var(--muted);font-size:18px;max-width:36ch}
.progress{margin:20px 20px 4px;display:flex;align-items:center;gap:14px;font-weight:600;color:var(--muted);font-size:15px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--soft);font-weight:600;font-size:15px;color:var(--ink);
  transition:background-color .18s,color .18s,border-color .18s,transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{opacity:.55;font-weight:500;margin-left:6px}
.cards{display:grid;gap:16px;padding:6px 20px 40px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;border-radius:24px;padding:26px 24px 24px;min-height:340px;display:flex;flex-direction:column;
  background:var(--c);color:#fff;text-align:left;border:0;width:100%;text-decoration:none;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 18px 32px -20px var(--c)}
  .card:hover .go{transform:translateX(3px)}}
.card:active{transform:scale(.985)}
.card:focus-visible{outline-offset:4px}
.card .thumb{display:block;width:100%;aspect-ratio:16/10;border-radius:18px;margin:20px 0 0;background:var(--surf);
  box-shadow:0 14px 28px -18px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.card:hover .thumb{transform:scale(1.015)}}
.theme{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:inline-flex;margin-left:auto}
.theme svg{width:26px;height:26px}
@media(hover:hover){.theme:hover{background:var(--soft)}}
.card .pb{height:8px;width:42%;border-radius:5px;background:rgba(255,255,255,.28);margin:0 0 30px 22px;overflow:hidden}
.card .pb i{display:block;height:100%;width:0;background:var(--lime);border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1) .2s}
.card.seen.ready .pb i{width:100%}
.tag{align-self:flex-start;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.card h2{margin:14px 0 10px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.2px}
.card p{margin:0;opacity:.8;font-size:16px}
.card .foot{margin-top:auto;padding-top:22px;display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.card .meta{display:flex;flex-direction:column;gap:12px;color:rgba(255,255,255,.62);font-size:15px;min-width:0}
.card .meta .mrow{display:flex;align-items:center;gap:10px;font-size:16px}
.card .meta svg{width:30px;height:30px;flex:none}
.go{background:var(--lime);color:#fff;font-weight:700;font-size:19px;border-radius:14px;padding:15px 20px;border:0;flex:1;text-align:center;max-width:260px;transition:transform .2s,filter .2s}
@media(hover:hover){.card:hover .go{filter:brightness(1.05)}}

/* lab */
.labhead{background:var(--lab);color:#fff;padding:14px 20px 78px}
.back{background:rgba(255,255,255,.18);border:0;border-radius:999px;color:#fff;font-weight:600;padding:8px 16px 8px 12px;display:inline-flex;gap:6px;align-items:center;font-size:15px;transition:background-color .15s}
.back:hover{background:rgba(255,255,255,.28)}
.labhead h1{margin:18px 0 6px;font-size:clamp(30px,8vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.7px}
.labhead p{margin:0;opacity:.9;max-width:40ch}
.labhead .tag{margin-top:16px;display:inline-block}
.sheet{margin-top:-58px;position:relative;padding:0 14px 60px}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-radius:26px;
  padding:8px;box-shadow:0 2px 0 var(--line), 0 12px 30px -18px rgba(31,35,64,.5)}
.stage canvas{display:block;width:100%;aspect-ratio:640/400;border-radius:20px;touch-action:pan-y}
.stage .paused{position:absolute;right:20px;top:18px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;
  border-radius:999px;padding:4px 12px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.stage.is-paused .paused{opacity:1;transform:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 6px 4px}
.btn{border-radius:16px;padding:12px 20px;font-weight:700;border:2px solid var(--line);background:var(--surf);
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background-color .15s,border-color .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn.main{background:var(--lime);border-color:var(--lime);color:#1B2A0A}
@media(hover:hover){.btn:not(.main):hover{border-color:var(--muted)}}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 6px}
.out{background:var(--soft);border-radius:18px;padding:12px 14px;min-width:0}
.out small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.out b.long{font-size:16px}
.out b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;display:block;overflow-wrap:anywhere;line-height:1.3;margin-top:2px}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:26px 6px 12px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 6px 10px}
.presets .chip{border:2px solid var(--line);background:var(--surf)}
.presets .chip[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:#fff}
.ctl{background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:10px 6px}
.ctl .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.val{background:var(--pink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;display:inline-block}
.val.pop{animation:pop .22s ease-out}
@keyframes pop{40%{transform:scale(1.08)}}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;margin:12px 0 2px;height:28px;accent-color:var(--lab);--fill:50%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(to right,var(--lab) var(--fill),var(--grid) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surf);
  border:4px solid var(--lab);margin-top:-9px;box-shadow:0 2px 6px rgba(31,35,64,.25);transition:transform .12s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--grid)}
input[type=range]::-moz-range-progress{height:8px;border-radius:5px;background:var(--lab)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surf);border:4px solid var(--lab)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--brand);outline-offset:2px}
.seg{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px;font-weight:600;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:#fff}
.note{border-radius:26px;padding:20px 22px;margin:14px 6px;background:var(--pink)}
.note b{font-weight:800}
.note.f{background:var(--soft)}
.note .fm{font-size:20px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.note .fm.t{font-size:17px;line-height:1.4}
.note ul,.note ol{margin:8px 0 0;padding-left:20px}
.note li{margin:6px 0}
.nextlab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 6px 0;padding:20px 22px;border-radius:26px;
  background:var(--c);color:#fff;text-decoration:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nextlab small{display:block;opacity:.8;font-size:14px;font-weight:600}
.nextlab b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.nextlab svg{flex:none;width:44px;height:44px;border-radius:14px;background:var(--lime);color:#1B2A0A;padding:12px;transition:transform .2s}
@media(hover:hover){.nextlab:hover svg{transform:translateX(3px)}}
.nextlab:active{transform:scale(.985)}
.cards{perspective:1200px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:30%;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 45%)}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-4px) rotateX(var(--rx)) rotateY(var(--ry))}.card:hover::after{opacity:1}}
.stage{perspective:1400px}
.stage canvas{--rx:0deg;--ry:0deg;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
/* меню разделов */
.menu{position:fixed;inset:0;z-index:50;background:rgba(10,10,14,.62);animation:fadeIn .2s ease-out}
.menu-sheet{background:var(--surf);border-radius:0 0 28px 28px;padding:20px 20px 24px;max-width:760px;margin:0 auto;max-height:100%;overflow-y:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
.menu-x{display:flex;margin:0 0 6px auto;background:none;border:0;padding:8px;border-radius:10px;color:var(--muted)}
.menu-x svg{width:26px;height:26px}
.menu nav a{display:flex;gap:18px;align-items:flex-start;padding:14px 20px;border-radius:16px;color:var(--ink);text-decoration:none;font-size:19px;font-weight:600;line-height:1.45}
.menu nav a svg{flex:none;width:28px;height:28px;margin-top:1px}
.menu nav a small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.menu nav a[aria-current="page"]{background:#9C9CA3;color:#fff}
.menu nav a[aria-current="page"] small{color:rgba(255,255,255,.8)}
@media(hover:hover){.menu nav a:not([aria-current]):hover{background:var(--soft)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(-24px);opacity:0}}
/* лабораторные работы */
.stage.work canvas{touch-action:none;transform:none!important;-webkit-user-select:none;user-select:none}
.hint{display:flex;gap:10px;align-items:flex-start;margin:14px 8px 0;color:var(--muted);font-size:14px;line-height:1.4}
.hint svg{flex:none;width:20px;height:20px;color:var(--lab)}
.toast{display:none;margin:12px 6px 0;padding:12px 16px;border-radius:16px;font-weight:600;font-size:15px;line-height:1.4;background:var(--soft)}
.toast.show{display:block;animation:viewIn .25s cubic-bezier(.2,.8,.2,1)}
.stage .toast{position:absolute;left:18px;right:18px;bottom:18px;margin:0;z-index:2;cursor:pointer;font-size:14.5px;padding:10px 14px;
  box-shadow:0 12px 28px -12px rgba(0,0,0,.45);background:var(--surf);border:2px solid var(--line)}
.stage .toast.err{background:var(--pink);border-color:var(--pink)}
.stage .toast.ok{background:var(--okbg);border-color:var(--okbg)}
.btn .cnt{background:rgba(27,42,10,.14);border-radius:999px;padding:1px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.toast.err{background:var(--pink)}
.toast.ok,.note.ok{background:rgba(153,204,66,.3)}
details.steps summary{cursor:pointer;font-weight:800;font-size:17px}
details.steps p{margin:10px 0 0}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin:0 8px 4px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:6px}
.legend .lm{background:var(--soft);border:2px solid var(--line)}
.legend .lc{border:2px solid var(--lab)}
.tblwrap{position:relative;overflow-x:auto;margin:10px 6px;border:2px solid var(--line);border-radius:20px;background:var(--surf)}
table.res{border-collapse:collapse;width:100%;font-size:14px}
table.res th{background:var(--soft);text-align:left;font-weight:700;font-size:12.5px;line-height:1.25;padding:10px 6px;vertical-align:bottom}
table.res th.c{color:var(--plum)}
table.res td{border-top:1px solid var(--line);padding:6px;vertical-align:middle}
table.res td.n{width:28px;text-align:center;font-weight:700;color:var(--muted)}
table.res td.k{font-weight:600;font-size:13.5px;min-width:92px;line-height:1.25}
table.res input{width:100%;min-width:66px;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surf);border:2px solid var(--lab);border-radius:10px;padding:7px 8px}
table.res input.m{border-color:var(--line);background:var(--soft)}
table.res input.ok{border-color:#367A55;background:rgba(54,122,85,.16)}
table.res input.bad{border-color:#C4245F;background:rgba(196,36,95,.12)}
table.res tr.flash td{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgba(153,204,66,.5)}100%{background:transparent}}
.rowclr{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 9px;border-radius:9px}
.rowclr:hover{background:var(--soft);color:var(--ink)}
.quiz label{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surf);cursor:pointer;transition:border-color .15s,background-color .15s}
.quiz label:has(input:checked){border-color:var(--lab)}
.quiz label.ok{border-color:#367A55;background:rgba(54,122,85,.14)}
.quiz label.bad{border-color:#C4245F;background:rgba(196,36,95,.08)}
.quiz input{accent-color:var(--lab);width:18px;height:18px;margin:2px 0 0;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .card:hover,.stage canvas{transform:none!important}
  .view,.val.pop{animation:none}
  .bar i,.card,.card .pb i,.go,.nextlab,.nextlab svg{transition:none}
  .toast.show,table.res tr.flash td,.menu,.menu-sheet{animation:none}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
const W=640,H=400;
const $=(s,r=document)=>r.querySelector(s);
const NF={};
const f1=(x,d=1)=>{x=Number(x);if(!isFinite(x))return '—';if(Math.abs(x)<0.5*Math.pow(10,-d))x=0;
  return (NF[d]||(NF[d]=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}))).format(x)};
const fJ=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кДж':f1(x,Math.abs(x)<10?2:0)+' Дж';
const fWt=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кВт':f1(x,0)+' Вт';
const fPa=x=>Math.abs(x)>=10000?f1(x/1000,1)+' кПа':f1(x,0)+' Па';
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const ease=(c,t,dt,k)=>c+(t-c)*(1-Math.exp(-dt*k));
const rgb=h=>{h=String(h).trim();if(h.startsWith('rgb')){const m=h.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mixc=(a,b,t)=>{const x=rgb(a),y=rgb(b);return `rgb(${Math.round(x[0]+(y[0]-x[0])*t)},${Math.round(x[1]+(y[1]-x[1])*t)},${Math.round(x[2]+(y[2]-x[2])*t)})`};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const FONT="'Golos Text',system-ui,sans-serif";
const G=9.8;
let TS=1;

let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['ink','muted','surf','grid','plum','teal','green','lime','soft','pink','line'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());
  C.dark=rgb(C.surf).reduce((a,b)=>a+b,0)<300;
}
function arrow(g,x1,y1,x2,y2,col,w){
  w=w||3;const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;
  const a=Math.atan2(y2-y1,x2-x1),h=Math.min(9+w,L*.9);
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.6,y2-Math.sin(a)*h*.6);g.stroke();

      txt(g,b[0],x+26,base+22,{a:'center',s:14,w:700});txt(g,f1(b[1],b[1]<10?1:0),x+26,base+40,{a:'center',s:12,c:C.muted,w:600})});
  },
  outs(S,P){const e=this.en(S,P);return[['Потенциальная Eп',fJ(e.Ep)],['Кинетическая Eк',fJ(e.Ek)],['Механическая Eп + Eк',fJ(e.Ep+e.Ek)],['Скорость мяча',f1(e.v,1)+' м/с']]}
});

/* ===================== ЛАБОРАТОРНЫЕ РАБОТЫ ===================== */
/* Интерактивные установки: предметы перетаскиваются мышью или пальцем,
   показания приборов записываются в таблицу, вычисления ученик делает сам. */
const DESK=352,MPX=1.3;
const metal=()=>C.dark?'#57526b':'#3a3e5c';
const wire=()=>C.dark?'#C9C5D8':'#4A4E6C';
const r05=x=>Math.round(x*20)/20;
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const WORKS=[];

/* ---------- модели оборудования ---------- */
function deskTop(g,y,d){
  d=d||70;const oy=d*DY,c=C.dark?'#5b4636':'#D8B78A';
  let gr=g.createLinearGradient(0,y+oy,0,y);gr.addColorStop(0,lighten(c,.16));gr.addColorStop(1,c);
  g.fillStyle=gr;g.fillRect(0,y+oy,W,-oy);
  g.strokeStyle=rgba(darken(c,.35),.16);g.lineWidth=1;
  for(let i=1;i<7;i++){const yy=y+oy*i/7;g.beginPath();for(let x=0;x<=W;x+=20)g.lineTo(x,yy+Math.sin(x*.017+i*2.1)*1.3);g.stroke()}
  gr=g.createLinearGradient(0,y,0,y+16);gr.addColorStop(0,darken(c,.1));gr.addColorStop(1,darken(c,.34));g.fillStyle=gr;g.fillRect(0,y,W,16);
  g.fillStyle='rgba(255,255,255,.4)';g.fillRect(0,y,W,1.2);
  gr=g.createLinearGradient(0,y+16,0,H);gr.addColorStop(0,C.dark?'rgba(0,0,0,.4)':'rgba(31,35,64,.14)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,y+16,W,H-y-16);
}
/* горизонтальный стержень */
function hrod(g,x1,x2,y,r,col){const gr=g.createLinearGradient(0,y-r,0,y+r);gr.addColorStop(0,darken(col,.1));gr.addColorStop(.3,lighten(col,.5));gr.addColorStop(.6,col);gr.addColorStop(1,darken(col,.45));
  g.fillStyle=gr;g.beginPath();g.roundRect(Math.min(x1,x2),y-r,Math.abs(x2-x1),2*r,r);g.fill()}
/* штатив: стержень в x, основание стоит на yb */
function standDraw(g,x,top,yb){box3(g,x-26.4,yb-12,112,12,metal(),40);cyl(g,x,top,yb-20,4.5,STEEL,{ry:1.6})}
function muff(g,x,y){box3(g,x-9,y-8,18,16,metal(),10,{shadow:false});sph(g,x-13,y,3.8,STEEL)}
function thread(g,x,y1,y2){g.strokeStyle=C.dark?'#E7E3F2':'#5A5F7A';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y1);g.lineTo(x,y2);g.stroke()}
/* спиральная пружина */
function spring3(g,X,top,bot,r,turns,col){const N=turns*24;
  for(const pass of [0,1,2]){g.strokeStyle=pass===0?rgba(col,.4):pass===1?col:'rgba(255,255,255,.35)';g.lineWidth=pass===0?1.8:pass===1?2.6:.9;g.lineCap='round';g.beginPath();
    for(let i=0;i<N;i++){const a1=i/24*2*Math.PI,a2=(i+1)/24*2*Math.PI,front=Math.sin((a1+a2)/2)>0;if(front!==(pass>0))continue;
      const y1=top+(bot-top)*i/N,y2=top+(bot-top)*(i+1)/N,o=pass===2?-.8:0;
      g.moveTo(X+r*Math.cos(a1)+o,y1+r*.32*Math.sin(a1)+o);g.lineTo(X+r*Math.cos(a2)+o,y2+r*.32*Math.sin(a2)+o)}g.stroke()}}
/* футляр для разновеса */
function caseDraw(g,cs){const{x,y,w,h,d}=cs,ox=d*DX,oy=d*DY,P=(u,f)=>[x+u+f*ox,y+f*oy];
  box3(g,x,y,w,h,'#7A4A28',d,{wood:true});
  const q=[P(7,.1),P(w-7,.1),P(w-7,.9),P(7,.9)];g.fillStyle=C.dark?'#4a1f30':'#7B2D45';g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.stroke();
  txt(g,'Разновес',x+w/2,y+h/2+4,{a:'center',s:11,c:'rgba(255,255,255,.8)',w:700})}
function caseSlots(cs,rows){const ox=cs.d*DX,oy=cs.d*DY;
  rows.forEach((row,ri)=>{const f=ri===0?.68:.3,tw=row.reduce((s,it)=>s+it.w,0),gap=(cs.w-14-tw)/(row.length+1);let u=7+gap;
    row.forEach(it=>{it.hx=cs.x+u+it.w/2+f*ox;it.hy=cs.y+f*oy;it.slot=1;u+=it.w+gap})})}
/* лупа-подпись над предметом */
function tagLbl(g,s,x,y){g.font=`700 ${12*TS}px ${FONT}`;const w=g.measureText(s).width+16,h=21*TS;
  x=clamp(x,w/2+4,W-w/2-4);y=Math.max(y,h+4);
  g.fillStyle=rgba(C.ink,.92);g.beginPath();g.roundRect(x-w/2,y-h,w,h,8);g.fill();
  txt(g,s,x,y-h/2+.5,{a:'center',b:'middle',s:12,c:C.surf,w:700})}

/* ---------- предметы ---------- */
let UID=0;
function mkGW(m){const r=4.5+Math.cbrt(m)*2.3;return{id:'g'+(++UID),type:'gw',m,r,w:r*2,h:r*1.25+r*.35+r*.42*1.6,name:'гиря '+m+' г',lab:m+' г'}}
function mkMG(mg){return{id:'g'+(++UID),type:'mg',m:mg/1000,mg,w:10+mg/100*1.4,h:7,name:'гиря '+mg+' мг',lab:mg+' мг'}}
function mkHW(){return{id:'h'+(++UID),type:'hw',m:102,w:24,h:36,hang:true,name:'груз 102 г (вес 1 Н)'}}
function mkBody(b){return Object.assign({type:'body',w:b.r*2,h:b.bh+b.r*.3+8},b)}
const loopTop=b=>b.y-b.bh-b.r*.3-7;
function drawIt(g,it,noSh){const x=it.x,y=it.y;
  if(it.type==='gw'){const r=it.r,h=r*1.25,nr=r*.42,nh=r*.35;if(!noSh)shadow(g,x,y+1,r*1.3,.22);
    cyl(g,x,y-h,y,r,BRASS,{ry:r*.28});cyl(g,x,y-h-nh,y-h+1,nr,BRASS,{ry:nr*.3});sph(g,x,y-h-nh-nr*.45,nr*1.15,BRASS);
    if(r>=8)txt(g,String(it.m),x,y-h*.28,{a:'center',s:r>=11?8.5:7,c:'#4A3608',w:800})}
  else if(it.type==='mg'){const w=it.w,d=9,ox=d*DX,oy=d*DY;if(!noSh)shadow(g,x+3,y-1,w*.6,.15);
    g.fillStyle=lighten(ALU,.18);g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x-w/2+ox,y+oy);g.lineTo(x+w/2+ox,y+oy);g.lineTo(x+w/2,y);g.closePath();g.fill();
    g.fillStyle=darken(ALU,.3);g.fillRect(x-w/2,y,w,1.6);box3(g,x+w/2-3,y-6,3,6,ALU,d,{shadow:false})}
  else if(it.type==='hw'){const k=wire();
    g.strokeStyle=k;g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(x,y+9);g.lineTo(x,y+3);g.arc(x+3.2,y+3,3.2,Math.PI,Math.PI*2);g.lineTo(x+6.4,y+5);g.stroke();
    cyl(g,x,y+9,y+31,11,IRON,{ry:3.2});
    g.lineWidth=1.8;g.beginPath();g.ellipse(x,y+33.5,2.6,2.8,0,0,7);g.stroke()}
  else if(it.type==='body'){const r=it.r,h=it.bh;if(!noSh)shadow(g,x,y+1,r*1.3,.22);
    cyl(g,x,y-h,y,r,it.col,{ry:r*.3});
    g.strokeStyle=wire();g.lineWidth=2;g.beginPath();g.ellipse(x,y-h-r*.3-3.5,2.8,4,0,0,7);g.stroke()}
}
function itRect(it){const hw=Math.max(it.w,24)/2+5,h=Math.max(it.h,26)+4;return it.hang?[it.x-hw,it.y-8,it.x+hw,it.y+h]:[it.x-hw,it.y-h,it.x+hw,it.y+6]}
function initItems(S){S.ord=0;S.drag=null;S.sel=null;S.hov=null;S.hz=null;S.time=0;
  for(const it of S.items){it.loc='tray';it.x=it.tx=it.hx;it.y=it.ty=it.hy;it.fly=false;it.order=0;it.zr=0}}
function drawTray(g,S){
  for(const it of S.items)if(it.slot){g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(it.hx,it.hy,it.w/2+1.5,(it.w/2+1.5)*.28,0,0,7);g.fill()}
  const its=S.items.filter(i=>i.loc==='tray').sort((a,c)=>a.y-c.y);
  for(const it of its){if(it.type==='hw')shadow(g,it.x+2,it.y+36,13,.2);drawIt(g,it)}
  for(const it of S.items)if(it.type==='body'&&it.short)txt(g,it.short,it.hx,DESK+12,{a:'center',s:11,c:'rgba(255,255,255,.92)',w:700})}

/* ---------- движок ---------- */
function mkWork(d){d.kind='work';
  d.step=function(S,P,dt){S.time+=dt;if(this.phys)this.phys(S,dt);wLayout(S,this);
    for(const it of S.items){if(it.loc==='drag')continue;
      if(it.fly){const k=it.slow?6:15;it.x=ease(it.x,it.tx,dt,k);it.y=ease(it.y,it.ty,dt,k);
        if(Math.abs(it.x-it.tx)+Math.abs(it.y-it.ty)<.6&&!it.hold){it.fly=false;it.x=it.tx;it.y=it.ty}}
      else{it.x=it.tx;it.y=it.ty}}};
  d.draw=function(g,S){this.scene(g,S);wOverlay(g,S,this)};
  d.zones=d.zones||(()=>[]);
  WORKS.push(d);
}
function wLayout(S,w){for(const it of S.items){it.hold=false;if(it.loc==='tray'){it.tx=it.hx;it.ty=it.hy}}if(w.layout)w.layout(S)}
function wSnap(){wLayout(S,cur);for(const it of S.items){it.x=it.tx;it.y=it.ty;it.fly=false}}
function wOverlay(g,S,w){const dr=S.drag&&S.drag.it,act=dr||S.sel;
  if(act){for(const z of w.zones(S)){const hot=S.hz===z;if(z.quiet&&dr&&!hot)continue;if(z.ok(act)!==true)continue;const r=z.r;
    g.save();g.setLineDash([7,6]);g.lineWidth=hot?3:2;g.strokeStyle=rgba(C.lime,hot?1:.75);g.fillStyle=rgba(C.lime,hot?.18:.06);
    g.beginPath();g.roundRect(r[0],r[1],r[2]-r[0],r[3]-r[1],14);g.fill();g.stroke();g.restore()}}
  if(S.sel&&!dr){const r=itRect(S.sel);g.save();g.strokeStyle=C.lime;g.lineWidth=3;g.beginPath();g.roundRect(r[0]-3,r[1]-3,r[2]-r[0]+6,r[3]-r[1]+6,10);g.stroke();g.restore()}
  if(dr){drawIt(g,dr);
    if(dr.type==='body'){const ly=loopTop(dr);thread(g,dr.x,ly,ly-24);sph(g,dr.x,ly-30,7,'#99CC42')}
    else if(dr.type==='hw')sph(g,dr.x+3,dr.y-5,7,'#99CC42')}
  const lb=dr||S.hov||S.sel;if(lb&&S.items.includes(lb)){const r=itRect(lb);tagLbl(g,lb.name,(r[0]+r[2])/2,r[1]-6)}
}
function wxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function pickIt(x,y){let best=null,bd=1e9;for(const it of S.items){if(it.loc==='drag')continue;const r=itRect(it);
  if(x<r[0]||x>r[2]||y<r[1]||y>r[3])continue;const d=Math.hypot(x-(r[0]+r[2])/2,y-(r[1]+r[3])/2);if(d<bd){bd=d;best=it}}return best}
function zoneAt(x,y){let best=null,bd=1e9;for(const z of cur.zones(S)){const r=z.r;if(x<r[0]||x>r[2]||y<r[1]||y>r[3])continue;
  const d=Math.abs(x-(r[0]+r[2])/2);if(d<bd){bd=d;best=z}}return best}
function putIt(it,z){const res=z?z.ok(it):false;
  if(res===true){it.loc=z.id;it.order=++S.ord}else{it.loc='tray';if(typeof res==='string')wToast(res,'err')}
  it.fly=true;if(cur.moved)cur.moved(S,it)}
function wDown(e){if(!cur||cur.kind!=='work')return;const[x,y]=wxy(e);S.pd={x,y,mv:false};
  const it=pickIt(x,y);
  const ok=it?(cur.canPick?cur.canPick(S,it):true):false;
  if(it&&ok!==true&&typeof ok==='string'){wToast(ok,'err');return}
  if(it&&ok===true){
    S.drag={it,ox:it.x-x,oy:it.y-y,from:it.loc};it.loc='drag';it.fly=false;S.hov=null;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.style.cursor='grabbing';e.preventDefault();return}
  for(const h of cur.handles||[])if(h.hit(S,x,y)){S.drag={h};h.start(S,x,y);try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.style.cursor='grabbing';e.preventDefault();return}
  if(S.sel){const s=S.sel;S.sel=null;const z=zoneAt(x,y);if(z)putIt(s,z)}
}
function wMove(e){if(!cur||cur.kind!=='work')return;const[x,y]=wxy(e);
  if(S.drag){if(S.pd&&Math.hypot(x-S.pd.x,y-S.pd.y)>5)S.pd.mv=true;
    if(S.drag.h)S.drag.h.move(S,x,y);else{const it=S.drag.it;it.x=clamp(x+S.drag.ox,8,W-8);it.y=clamp(y+S.drag.oy,8,H-4);S.hz=zoneAt(x,y)}
    e.preventDefault();return}
  S.hov=e.pointerType==='mouse'?pickIt(x,y):null;
  const h=(cur.handles||[]).find(h=>h.hit(S,x,y));
  cv.style.cursor=S.hov?'grab':h?(h.cur||'grab'):S.sel&&zoneAt(x,y)?'pointer':'';
}
function wUp(e){if(!S.drag)return;const d=S.drag;S.drag=null;S.hz=null;cv.style.cursor='';
  if(d.h){if(d.h.end)d.h.end(S);return}
  const it=d.it;
  if(!S.pd||!S.pd.mv){it.loc=d.from;it.fly=true;S.sel=S.sel===it?null:it;return}
  const[x,y]=wxy(e),z=e.type==='pointercancel'?null:zoneAt(x,y);
  if(z)putIt(it,z);else{it.loc='tray';it.fly=true;if(cur.moved)cur.moved(S,it)}
  S.sel=null;
}
let toastT=0;
function wToast(msg,kind){const el=$('#wmsg');if(el&&!el.onclick)el.onclick=()=>{el.className='toast'};if(!el)return;el.textContent=msg;el.className='toast show '+(kind||'');
  clearTimeout(toastT);toastT=setTimeout(()=>{el.className='toast'},5000)}

/* ---------- рычажные весы ---------- */
function balInit(S,o){S.bal=Object.assign({a:0,w:0,mL:0,mR:0},o)}
function balPans(b){const ca=Math.cos(b.a),sa=Math.sin(b.a);return{L:[b.cx-b.L*ca,b.py-b.L*sa],R:[b.cx+b.L*ca,b.py+b.L*sa]}}
function balPhys(S,dt){const b=S.bal;let mL=0,mR=0;for(const it of S.items){if(it.loc==='panL')mL+=it.m;else if(it.loc==='panR')mR+=it.m}b.mL=mL;b.mR=mR;
  const t=0.2*Math.tanh((mR-mL)/0.6),n=6,h=dt/n;for(let i=0;i<n;i++){b.w+=(55*(t-b.a)-5*b.w)*h;b.a+=b.w*h}}
const balEq=b=>Math.abs(b.mR-b.mL)<0.05,balCalm=b=>Math.abs(b.w)<0.03&&Math.abs(b.a)<0.012;
function balLayout(S){const b=S.bal,p=balPans(b),rowW=b.pr*2-10;
  for(const s of ['L','R']){const its=S.items.filter(it=>it.loc==='pan'+s).sort((a,c)=>a.order-c.order),[ex,ey]=p[s],y=ey+b.hd;
    const rows=[[]];let w=0;
    for(const it of its){if(rows[rows.length-1].length&&w+it.w>rowW){rows.push([]);w=0}rows[rows.length-1].push(it);w+=it.w+2}
    rows.forEach((row,ri)=>{const tw=row.reduce((q,it)=>q+it.w+2,-2);let x=ex-tw/2+ri*8;row.forEach(it=>{it.tx=x+it.w/2;it.ty=y+3-ri*6;it.zr=ri;x+=it.w+2})})}}
function balZones(S){const b=S.bal,p=balPans(b);return['L','R'].map(s=>{const[x,y]=p[s],sy=y+b.hd;return{id:'pan'+s,r:[x-b.pr-14,sy-112,x+b.pr+14,sy+26],ok:()=>true}})}
function balDraw(g,S){
  const b=S.bal,p=balPans(b),cx=b.cx,py=b.py,R=b.pr,ry=R*.27;
  box3(g,cx-b.bw/2-12.4,b.base-16,b.bw,16,metal(),40);
  cyl(g,cx,py+6,b.base-24,5.5,STEEL,{ry:2});
  const sy=py+86;box3(g,cx-26,sy,52,13,'#F2EEDF',5,{shadow:false});
  g.strokeStyle='#3a3e5c';g.lineWidth=1;for(let i=-5;i<=5;i++){const x=cx+i*4.6;g.beginPath();g.moveTo(x,sy+1);g.lineTo(x,sy+(i?5:10));g.stroke()}
  for(const s of ['L','R']){const[ex,ey]=p[s],y=ey+b.hd;
    shadow(g,ex+8,b.base-8,R*.9,.12);
    g.strokeStyle=wire();g.lineWidth=1.3;g.beginPath();
    g.moveTo(ex,ey+5);g.lineTo(ex-R+5,y);g.moveTo(ex,ey+5);g.lineTo(ex+R-5,y);g.moveTo(ex,ey+5);g.lineTo(ex+6,y-ry);g.stroke();
    let gr=g.createLinearGradient(ex-R,0,ex+R,0);gr.addColorStop(0,darken(ALU,.3));gr.addColorStop(.35,lighten(ALU,.45));gr.addColorStop(1,darken(ALU,.45));
    g.fillStyle=gr;g.beginPath();g.moveTo(ex-R,y);g.bezierCurveTo(ex-R*.75,y+ry+13,ex+R*.75,y+ry+13,ex+R,y);g.ellipse(ex,y,R,ry,0,0,Math.PI,false);g.closePath();g.fill();
    gr=g.createLinearGradient(0,y-ry,0,y+ry);gr.addColorStop(0,darken(ALU,.22));gr.addColorStop(1,lighten(ALU,.35));
    g.fillStyle=gr;g.beginPath();g.ellipse(ex,y,R,ry,0,0,7);g.fill();
    const its=S.items.filter(it=>it.loc==='pan'+s).sort((a,c)=>c.zr-a.zr||a.x-c.x);for(const it of its)drawIt(g,it,true);
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.2;g.beginPath();g.ellipse(ex,y,R-.6,ry-.4,0,.1*Math.PI,.9*Math.PI);g.stroke();
  }
  const ca=Math.cos(b.a),sa=Math.sin(b.a),rot=(x,y)=>[cx+(x-cx)*ca-(y-py)*sa,py+(x-cx)*sa+(y-py)*ca],L=b.L+7;
  prism3(g,[rot(cx-16,py-2),rot(cx+16,py-2),rot(cx,py-17)],9,metal());
  prism3(g,[rot(cx-L,py-3.5),rot(cx+L,py-3.5),rot(cx+L,py+3.5),rot(cx-L,py+3.5)],9,metal());
  g.strokeStyle=C.plum;g.lineWidth=2.4;g.lineCap='round';g.beginPath();g.moveTo(cx,py);g.lineTo(cx-sa*88,py+ca*88);g.stroke();
  sph(g,cx,py,5.5,STEEL);for(const s of ['L','R']){const[ex,ey]=p[s];sph(g,ex,ey+2,3.6,STEEL)}
}
function balRead(S){const b=S.bal,L=S.items.filter(i=>i.loc==='panL'),R=S.items.filter(i=>i.loc==='panR'),bl=L.filter(i=>i.type==='body');
  if(!bl.length)return{err:'Положите тело на левую чашу весов.'};
  if(bl.length>1)return{err:'Взвешивайте тела по одному.'};
  if(L.length>1||R.some(i=>i.type==='body'))return{err:'Тело кладут на левую чашу, а гири — только на правую.'};
  if(!R.length)return{err:'Положите на правую чашу гири.'};
  if(!balEq(b))return{err:b.mL>b.mR?'Весы не уравновешены: тело тяжелее гирь — добавьте гирю.':'Весы не уравновешены: гири тяжелее тела — снимите лишнее.'};

  const it=bl[0];return{key:it.id,k:{name:it.name},m:{m:Math.round(b.mR*10)/10},body:it}}
function balOuts(S){const b=S.bal,L=S.items.filter(i=>i.loc==='panL'),R=S.items.filter(i=>i.loc==='panR').sort((a,c)=>c.m-a.m);
  const nm=a=>a.type==='body'?'тело '+a.short:a.lab;
  return[['Левая чаша',L.length?L.map(nm).join(', '):'пусто'],['Правая чаша',R.length?R.map(nm).join(' + '):'пусто'],
    ['Весы',!L.length&&!R.length?'чаши пусты':balEq(b)?'в равновесии':b.mL>b.mR?'перевешивает левая чаша':'перевешивает правая чаша']]}

/* ---------- мензурка / стакан ---------- */
function glassBack(g,cx,bot,r,top,foot){const ry=r*.28;
  if(foot){g.save();g.globalAlpha=.85;cyl(g,cx,foot-5,foot,r+16,C.dark?'#7d8ea3':'#C3D2E2',{ry:(r+16)*.28,shadow:true});g.restore()}
  g.fillStyle=C.dark?'rgba(255,255,255,.05)':'rgba(120,150,190,.08)';g.fillRect(cx-r,top,2*r,bot-top);
  g.fillStyle=C.dark?'rgba(255,255,255,.08)':'rgba(140,170,205,.22)';g.beginPath();g.moveTo(cx-r,bot);g.ellipse(cx,bot,r,ry,0,Math.PI,0,true);g.lineTo(cx+r,(foot||bot+8)-5);g.lineTo(cx-r,(foot||bot+8)-5);g.closePath();g.fill();
  g.strokeStyle=rgba(C.ink,.22);g.lineWidth=1.2;g.beginPath();g.ellipse(cx,top,r,ry,0,Math.PI,2*Math.PI);g.stroke();
  g.fillStyle=C.dark?'rgba(255,255,255,.06)':'rgba(120,150,190,.12)';g.beginPath();g.ellipse(cx,bot,r,ry,0,0,7);g.fill()}
function glassLiquid(g,cx,bot,r,ly,col){const ry=r*.28;
  const gr=g.createLinearGradient(cx-r,0,cx+r,0);gr.addColorStop(0,rgba(darken(col,.15),.55));gr.addColorStop(.3,rgba(lighten(col,.35),.34));gr.addColorStop(.7,rgba(col,.42));gr.addColorStop(1,rgba(darken(col,.35),.6));
  g.fillStyle=gr;g.beginPath();g.moveTo(cx-r,ly);g.lineTo(cx-r,bot);g.ellipse(cx,bot,r,ry,0,Math.PI,0,true);g.lineTo(cx+r,ly);g.ellipse(cx,ly,r,ry,0,0,Math.PI,false);g.closePath();g.fill();
  g.fillStyle=rgba(lighten(col,.45),.55);g.beginPath();g.ellipse(cx,ly,r,ry,0,0,7);g.fill();
  g.strokeStyle=rgba(lighten(col,.75),.95);g.lineWidth=1.3;g.beginPath();g.ellipse(cx,ly,r-.5,ry-.3,0,0,Math.PI);g.stroke()}
function glassFront(g,cx,bot,r,top,o){o=o||{};const ry=r*.28;
  g.strokeStyle=C.ink;g.lineWidth=2.5;g.lineJoin='round';g.beginPath();g.moveTo(cx-r,top);g.lineTo(cx-r,bot+8);g.ellipse(cx,bot+8,r,ry,0,Math.PI,0,true);g.lineTo(cx+r,top);g.stroke();
  g.lineWidth=1.8;g.beginPath();g.ellipse(cx,top,r,ry,0,0,Math.PI);g.stroke();
  g.fillStyle='rgba(255,255,255,.38)';g.fillRect(cx-r+5,top+10,3.5,bot-top-14);g.fillStyle='rgba(255,255,255,.16)';g.fillRect(cx+r-10,top+14,2,bot-top-22);
  if(o.vmax){const side=o.side||1;
    for(let v=0;v<=o.vmax;v+=2){const y=bot-v*MPX,big=v%10===0;g.strokeStyle=rgba(C.ink,big?.9:.5);g.lineWidth=big?1.4:.8;
      const x0=cx+side*(r-2),x1=x0-side*(big?12:6);g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();
      if(v%20===0&&v>0)txt(g,String(v),cx+side*(r+5),y+4,{a:side>0?'left':'right',s:10,c:C.ink,w:600})}
    txt(g,'мл',cx+side*(r+5),top+6,{a:side>0?'left':'right',s:10,c:C.muted,w:600})}}
function mensSub(S,M){let b=S.items.find(i=>i.loc==='mens');
  if(!b){const d=S.drag&&S.drag.it;if(d&&d.type==='body'&&Math.abs(d.x-M.cx)<M.r-d.r+2&&d.y<M.bot+4)b=d}
  let lv=M.V1,hs=0;if(b){const q=(b.r/M.r)**2;hs=clamp((b.y-(M.bot-M.V1*MPX))/(1-q),0,b.bh);lv=M.V1+b.V*hs/b.bh}
  M.lv=lv;M.hs=hs;M.b=b}
function mensLayout(S,M){const rim=M.bot-M.vmax*MPX-16;
  for(const it of S.items)if(it.loc==='mens'){
    if(Math.abs(it.x-M.cx)>1.5){it.slow=false;it.hold=true;it.fly=true;it.tx=M.cx;it.ty=Math.min(it.y,rim);if(it.y>rim+1&&Math.abs(it.x-M.cx)>M.r-it.r)it.tx=it.x}
    else{it.slow=it.y>M.bot-M.V1*MPX-4;it.tx=M.cx;it.ty=M.bot+2}}else it.slow=false}
function mensZone(S,M){return{id:'mens',r:[M.cx-M.r-34,24,M.cx+M.r+34,M.bot+16],ok:it=>it.type!=='body'?false:S.items.some(o=>o.loc==='mens')?'В мензурке уже есть тело — сначала выньте его.':true}}
function mensDraw(g,S,M){const top=M.bot-M.vmax*MPX-12;
  glassBack(g,M.cx,M.bot,M.r,top,DESK-6);
  const b=S.items.find(i=>i.loc==='mens');if(b){thread(g,b.x,loopTop(b),top-28);drawIt(g,b,true)}
  glassLiquid(g,M.cx,M.bot,M.r,M.bot-M.lv*MPX,'#4F86C6');
  glassFront(g,M.cx,M.bot,M.r,top,{vmax:M.vmax,side:M.side||1})}
function wWater(S,d){const M=S.M;if(S.items.some(i=>i.loc==='mens')){wToast('Сначала выньте тело из мензурки.','err');return}
  const v=clamp(M.V1+d,80,140);if(v===M.V1){wToast(d>0?'Больше доливать не нужно — тело поднимет воду ещё выше.':'Воды должно хватить, чтобы тело погрузилось полностью.','err');return}
  M.V1=v;M.lv=v;wToast(d>0?'Долили 10 мл воды. Определите новый уровень V₁.':'Отлили 10 мл воды. Определите новый уровень V₁.','ok')}

}
let LIGHT=null;
function frame(){
  g.setTransform(cv.width/W,0,0,cv.width/W,0,0);
  g.clearRect(0,0,W,H);g.fillStyle=C.surf;g.fillRect(0,0,W,H);
  if(!LIGHT||LIGHT.dark!==C.dark||LIGHT.surf!==C.surf){const lg=g.createLinearGradient(0,0,0,H);lg.addColorStop(0,C.dark?'rgba(255,255,255,.035)':'rgba(255,255,255,0)');lg.addColorStop(1,C.dark?'rgba(0,0,0,.14)':'rgba(31,35,64,.04)');LIGHT={g:lg,dark:C.dark,surf:C.surf}}
  if(!LIGHT.v){const v=g.createRadialGradient(W/2,H*.42,140,W/2,H*.42,470);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,C.dark?'rgba(0,0,0,.22)':'rgba(31,35,64,.06)');LIGHT.v=v}
  g.fillStyle=LIGHT.g;g.fillRect(0,0,W,H);g.fillStyle=LIGHT.v;g.fillRect(0,0,W,H);
  g.save();cur.draw(g,S,P);g.restore();
}
function loop(ts){
  if(!cur)return;
  const dt=clamp((ts-last)/1000,0,.033);last=ts;
  if(!paused&&dt>0)cur.step(S,P,dt);
  frame();
  outT+=dt;if(outT>.15){outT=0;updateOuts()}
  raf=requestAnimationFrame(loop);
}
function stop(){cancelAnimationFrame(raf);raf=0}
function setPaused(v){
  paused=v;const b=$('[data-act="pause"]');if(!b)return;
  b.setAttribute('aria-pressed',v);b.innerHTML=(v?ICON.play:ICON.pause)+`<span>${v?'Продолжить':'Пауза'}</span>`;
  const st=$('.stage');if(st)st.classList.toggle('is-paused',v);
}
function goHome(){if(fromHome){fromHome=false;history.back()}else{location.hash=cur&&cur.kind==='work'?'works':''}}

app.addEventListener('click',e=>{
  const a=e.target.closest('a.card,a.nextlab');if(a){if(!cur)fromHome=true;return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act==='menu'){openMenu();return}
  if(t.dataset.act==='theme'){const th=C.dark?'light':'dark';document.documentElement.dataset.theme=th;try{localStorage.setItem('lab-sirius-theme',th)}catch(_){}
    t.innerHTML=th==='dark'?ICON.sun:ICON.moon;t.setAttribute('aria-label',th==='dark'?'Светлая тема':'Тёмная тема');return}
  if(t.dataset.act==='home'){if(cur)goHome();else if(location.hash==='#works')location.hash='';else window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.act==='back'){goHome();return}
  if(t.dataset.cat){setFilter(t.dataset.cat);return}
  if(!cur)return;
  if(cur.kind==='work'){const a=t.dataset.act;
    if(a==='rec')wRecord();else if(a==='wreset')wRestart();else if(a==='check')wCheck();
    else if(a==='tclear'){T.forEach((r,i)=>wClearRow(i));$('#verdict').hidden=true}
    else if(a==='rowclr')wClearRow(+t.dataset.r);
    else if(t.dataset.wact!==undefined){cur.actions[+t.dataset.wact][1](S);updateOuts()}
    return}
  if(t.dataset.act==='pause'){setPaused(!paused);return}
  if(t.dataset.act==='restart'){cur.init(S,P);setPaused(false);updateOuts();return}
  if(t.dataset.act==='reset'){cur.params.forEach(p=>P[p.id]=p.val);cur.init(S,P);syncControls();clearPresets();updateOuts();return}
  if(t.dataset.preset!==undefined){Object.assign(P,cur.presets[+t.dataset.preset][1]);cur.init(S,P);syncControls();clearPresets();t.setAttribute('aria-pressed','true');setPaused(false);updateOuts();return}
  const seg=t.closest('[data-seg]');
  if(seg){if(P[seg.dataset.seg]===t.dataset.v)return;P[seg.dataset.seg]=t.dataset.v;syncControls();clearPresets();changed(seg.dataset.seg);updateOuts()}
});
app.addEventListener('input',e=>{
  const el=e.target;if(el.closest&&el.closest('#wtab')){el.classList.remove('ok','bad');return}
  if(!el.dataset.p||!cur)return;
  const p=cur.params.find(x=>x.id===el.dataset.p);P[p.id]=parseFloat(el.value);setFill(el);
  const v=$('#v_'+p.id);v.textContent=fmtVal(p,P[p.id]);bump(v);clearPresets();changed(p.id);updateOuts();
});
document.addEventListener('keydown',e=>{
  if(!cur||e.altKey||e.ctrlKey||e.metaKey)return;const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'&&cur.kind==='work'&&S.sel){S.sel=null;return}
  if(e.key==='Escape'){if(tag!=='input'||cur.kind!=='work')goHome();return}
  if(e.key===' '&&cur.kind!=='work'&&tag!=='input'&&tag!=='button'&&tag!=='a'){e.preventDefault();setPaused(!paused)}
});
function route(){
  const h=location.hash;let m;
  if((m=h.match(/^#lab\/([\w-]+)$/))&&LABS.some(l=>l.id===m[1]))openLab(m[1]);
  else if((m=h.match(/^#work\/([\w-]+)$/))&&WORKS.some(w=>w.id===m[1]))openWork(m[1]);
  else if(h==='#works'){fromHome=false;worksHome()}
  else{fromHome=false;home()}
}
const tiltOK=()=>window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
app.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||!tiltOK())return;
  const c=e.target.closest('.card');
  if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');
    c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');return}
  const st=e.target.closest('.stage:not(.work)');
  if(st&&cv){const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    cv.style.setProperty('--ry',((x-.5)*4).toFixed(2)+'deg');cv.style.setProperty('--rx',((.5-y)*3).toFixed(2)+'deg')}
});
app.addEventListener('pointerout',e=>{
  const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}
  const st=e.target.closest('.stage');if(st&&cv&&!st.contains(e.relatedTarget)){cv.style.setProperty('--rx','0deg');cv.style.setProperty('--ry','0deg')}
});
window.addEventListener('hashchange',route);
let thumbRT=0;window.addEventListener('resize',()=>{sizeCanvas();if(!cur){clearTimeout(thumbRT);thumbRT=setTimeout(paintThumbs,200)}});
if(window.ResizeObserver)new ResizeObserver(()=>sizeCanvas()).observe(app);
const themeUpdate=()=>{readColors();if(cur&&g&&paused)frame();if(!cur)paintThumbs()};
if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?mq.addEventListener('change',themeUpdate):mq.addListener&&mq.addListener(themeUpdate)}
new MutationObserver(themeUpdate).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
document.addEventListener('visibilitychange',()=>{last=performance.now()});

try{const th=localStorage.getItem('lab-sirius-theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(_){}
readColors();route();
})();
</script>
</body>
