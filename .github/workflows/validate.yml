name: Проверка Аксиоры
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/build_en.py
      - run: git diff --exit-code -- en/index.html
      - run: python tools/validate_tasks.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/brand.test.cjs
